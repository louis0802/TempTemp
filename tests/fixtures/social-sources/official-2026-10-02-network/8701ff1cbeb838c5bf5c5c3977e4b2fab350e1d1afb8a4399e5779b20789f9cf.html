cription":"<img style='width:300px;position:absolute;top:0;right:0;pointer-events:none' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/home/bg_chilli.jpg'>","style":{"position":"relative","paddingTop":"0","paddingBottom":"0"}},{"type":"two-columns","columnsOverlapOnMobile":false,"fullWidth":false,"reverse":false,"columns":[{"type":"image","image":{"src":"https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/home/collage.png","style":{"position":"relative","zIndex":1}}},{"type":"text","align":"left","header":"<div class='text-center sm:text-left'>COLOUR YOUR PARTIES <br class='hidden sm:block'><span class='whitespace-nowrap'>WITH OUR <span class='font-display-alt' style='color:#FFCB1F;margin:0 4px;line-height:0'>catering</span></span></div>","description":"Host a poke party in your office or home! When we say we deliver our rainbow bowls islandwide, we mean it! We do catering for large orders of individual poke bowls, juices, snacks and more — so that you can eat colourful wherever you are, at any event, party or gathering."}],"style":{"backgroundColor":"#000000"}},{"type":"one-column","description":"<img style='width:300px;position:absolute;top:-200px;left:0;pointer-events:none' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/home/bg_garlic.jpg'>","style":{"position":"relative","paddingTop":"0","paddingBottom":"0"}},{"type":"one-column","header":null,"description":"<div class='flex flex-col items-center justify-center py-4 space-y-4'><div class='text-xs font-display text-green'>Go green with us!</div><img src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/home/arrow-down.png' style='height:40px'></div>","style":{"backgroundColor":"#000000","paddingTop":"0","paddingBottom":"0"}},{"type":"two-columns","columnsOverlapOnMobile":false,"fullWidth":false,"reverse":true,"columns":[{"type":"image","image":{"src":"https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/home/poke-bag.png"}},{"type":"text","align":"left","header":"<div class='text-center sm:text-left'>KEEP OUR SEAS <br class='hidden sm:block'><span class='whitespace-nowrap'><span class='font-display-alt' style='color:#1c94ea;margin:0 4px;line-height:0'>blue</span> BY GOING</span> <br class='hidden sm:block'><span class='whitespace-nowrap'><span class='font-display-alt' style='color:#8DC63F;margin:0 4px;line-height:0'>green</span> WITH US</span></div>","description":"We’re on a journey to being 100% plastic-free, and we hope you’ll be a part of it with us! Our fast-casual business model requires a high turnover of single-use packaging, and that quickly stacks up against the environment. That’s why all our biodegradable cutlery are made from plants, bowls and snack packs from recycled paper, even our cold pressed juice are sold in reusable glass bottles.<br><br>Bring your own reusable container and we’ll gladly pack your poke or açai bowl in them, and offer you a free paid topping as a yummy thank you! We also sell reusable stainless steel straws and lunch bags in our stores."}],"style":{"backgroundColor":"#000000"}},{"type":"one-column","header":null,"description":"<div class='flex flex-col items-center justify-center py-4 space-y-4'><div class='text-xs font-display text-primary'>Back to top</div><img src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/home/arrow-up.png' style='height:40px;cursor:pointer' onclick='document.querySelector(`#scroller`).scrollTo(0,0);'></div>","style":{"backgroundColor":"#000000","paddingTop":"0","paddingBottom":"0"}}]},"pages":[{"path":"/our-values","showOnNavbar":true,"label":"Our Values","sections":[{"type":"one-column","description":"<img style='width:500px;position:absolute;top:0;left:0;pointer-events:none' class='hidden sm:block' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/our-values/bg_rice.jpg'><img style='width:300px;position:absolute;top:300px;right:0;pointer-events:none' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/our-values/bg_kale.jpg'><img style='height:350px;position:absolute;top:0;right:0;pointer-events:none' class='hidden lg:block' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/our-values/pokebowl-group.jpg'>","style":{"position":"relative","paddingTop":"0","paddingBottom":"0"}},{"type":"one-column","header":"<div class='mb-8 text-center sm:text-left relative'>Our Story</div>","description":"<style type='text/css'>@media(min-width:768px){.intro-description{width:60%;}}</style><div class='relative max-w-5xl mx-auto'><div class='mb-6 text-xl text-center sm:text-left font-display text-primary'>Our Values</div><div class='mb-8 text-base sm:text-lg intro-description'>It all began with simple seasoning of the cut offs from every fisherman’s catch, served by itself as a snack. Poke – ‘pronounced as “poh-kay”, is the Hawaiian verb for “section” or “to slice or cut”.</div><div class='grid md:grid-cols-2 gap-x-6 gap-y-8'><div class='space-y-4'><img class='w-16 h-16 mx-auto sm:mx-0' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/our-values/icon_smallbatch.png'><div class='text-lg text-center sm:text-left font-display'>SMALL-BATCH COOKING</div><div>Food tastes best when it’s made fresh. That’s why we love receiving produce every morning and preparing them in small batches to serve throughout the day. It helps keep our food wastage low while we make every rainbow bowl to order.</div></div><div class='space-y-4'><img class='w-16 h-16 mx-auto sm:mx-0' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/our-values/icon_lowwastage.png'><div class='text-lg text-center font-display sm:text-left'>LOW FOOD WASTAGE</div><div>We’re always looking for better, smarter ways to reduce our food wastage as a brand and business. Preparing our food in small batches not only ensures our product gets to you in its best quality, but also helps us be mindful about food wastage. We also believe in finding a use for parts of fresh produce that otherwise go to waste - like the cores of our pineapples and Japanese cucumbers, or stems of our kale. We save them to make our cold pressed juices on a daily basis.</div></div><div class='space-y-4'><img class='w-16 h-16 mx-auto sm:mx-0' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/our-values/icon_eatcolourful.png'><div class='text-lg text-center font-display sm:text-left'>EAT COLOURFUL!</div><div>Our approach to health is simple. Fresh, colourful food is packed with the most nutrients that the earth provides us with. When you eat a rainbow, your diet is balanced and your food - super Instagrammable!</div></div><div class='space-y-4'><img class='w-16 h-16 mx-auto sm:mx-0' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/our-values/icon_greatprotein.png'><div class='text-lg text-center font-display sm:text-left'>GREAT PROTEIN FIX</div><div>Think of it as sushi in a bowl, without the fancy price tag. Also, it’s packed with a vibrant array of fruits and vegetables. Our bowls feed the lightest of eaters at under 250kcal (for a Light vegan Avocado Poke bowl), but also satisfy the gym buffs looking for a great protein fix - more raw tuna poke anybody?</div></div></div></div>","style":{"backgroundColor":"#000000","textAlign":"left"}}]},{"path":"/how-we-began","showOnNavbar":true,"label":"How We Began","sections":[{"type":"one-column","description":"<img style='width:700px;position:absolute;top:0;right:0;pointer-events:none' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/how-we-began/bg_storefront.jpg'><img style='width:300px;position:absolute;top:80px;left:0;pointer-events:none' class='hidden sm:block' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/how-we-began/pokebowl_side.jpg'><img style='width:250px;position:absolute;top:800px;right:0;pointer-events:none' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/how-we-began/bg_acai.jpg'>","style":{"position":"relative","paddingTop":"0","paddingBottom":"0"}},{"type":"one-column","header":"<div class='mb-8 text-center sm:text-left'>Our Story</div>","description":"<div class='relative max-w-5xl mx-auto' style='position:relative;z-index:1'><div class='mb-6 text-xl text-center font-display text-primary sm:text-left'>How We Began</div><div class='relative space-y-12'><div class='flex sm:space-x-6'><div class='hidden sm:w-1/2 sm:block'>&nbsp;</div><div><div class='w-4 h-1 rounded' style='position: relative; top: 40px; transform: translateY(-50%); background-color: white;'></div><div class='w-1 rounded' style='position: relative; left: 50%; transform: translateX(-50%); background-color: white; height: calc(100% + 50px);'></div></div><div class='flex-grow ml-6 space-y-2 text-left sm:w-1/2'><img src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/how-we-began/timeline-icon.png' class='inline-block' style='width: 60px;'><div class='text-2xl font-display'>2016</div><div>July 2016. We opened our doors to a queue and sold out in 2 hours in our little Telok Ayer shophouse. Poke Theory went viral on mainstream and social media and we had to adapt quickly to meet the demand. With each day, we learned and grew as a small family business led by founders &amp; siblings, Joey &amp; Vannessa Lee.</div></div></div><div class='flex sm:space-x-6 sm:flex-row-reverse sm:space-x-reverse'><div class='hidden sm:w-1/2 sm:block'>&nbsp;</div><div><div class='w-4 h-1 rounded' style='position: relative; top: 40px; transform: translateY(-50%); background-color: white;'></div><div class='w-1 rounded' style='position: relative; height: calc(100% + 50px); left: 50%; transform: translateX(-50%); background-color: white;'></div></div><div class='flex-grow ml-6 space-y-2 text-left sm:w-1/2 sm:text-right'><img src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/how-we-began/timeline-icon.png' class='inline-block' style='width: 60px;'><div class='text-2xl font-display'>2017</div><div>November 2017. Our 1st franchise store at DUO Galleria opened its doors to a long queue once more. We spent the past year and more working hard on an airtight franchise model, then brought it to life.</div></div></div><div class='flex sm:space-x-6'><div class='hidden sm:w-1/2 sm:block'>&nbsp;</div><div><div class='w-4 h-1 rounded' style='position: relative; top: 40px; transform: translateY(-50%); background-color: white;'></div><div class='w-1 rounded' style='position: relative; height: calc(100% + 50px); left: 50%; transform: translateX(-50%); background-color: white;'></div></div><div class='flex-grow ml-6 space-y-2 text-left sm:w-1/2'><img src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/how-we-began/timeline-icon.png' class='inline-block' style='width: 60px;'><div class='text-2xl font-display'>2018</div><div>April 2018. Our 2nd and 3rd franchise store opened within a week of each other. It was hectic! But a good hectic. Kent Ridge was our first foray into the heartlands and Marina One was an add on to the bustling CBD.<br><br>December 2018. Our 4th franchise store and second foray into the heartlands joined the ranks! Novena hit the ground running.</div></div></div><div class='flex sm:space-x-6 sm:flex-row-reverse sm:space-x-reverse'><div class='hidden sm:w-1/2 sm:block'>&nbsp;</div><div><div class='w-4 h-1 rounded' style='position: relative; top: 40px; transform: translateY(-50%); background-color: white;'></div><div class='w-1 rounded' style='position: relative; height: calc(100% + 50px); left: 50%; transform: translateX(-50%); background-color: white;'></div></div><div class='flex-grow ml-6 space-y-2 text-left sm:w-1/2 sm:text-right'><img src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/how-we-began/timeline-icon.png' class='inline-block' style='width: 60px;'><div class='text-2xl font-display'>2019</div><div>April 2019. We did a brand refresh - our entire brand got a facelift! Somerset was our 5th franchise store to open to queues again, but the first to sport this brand, spanking new look. We gave away 100 poke bowls to celebrate our milestone!<br><br>August 2019. Hello Indonesia! We opened our first overseas franchise store in Surabaya after months of R&amp;D and trips back and forth with our tiny but mighty team. Three days later, we signed our first investors, and became part of the Commonwealth Capital family.</div></div></div><div class='flex sm:space-x-6'><div class='hidden sm:w-1/2 sm:block'>&nbsp;</div><div><div class='w-4 h-1 rounded' style='position: relative; top: 40px; transform: translateY(-50%); background-color: white;'></div><div class='w-1 rounded' style='position: relative; height: calc(100% + 50px); left: 50%; transform: translateX(-50%); background-color: white;'></div></div><div class='flex-grow ml-6 space-y-2 text-left sm:w-1/2'><img src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/how-we-began/timeline-icon.png' class='inline-block' style='width: 60px;'><div class='text-2xl font-display'>2020</div><div>May 2020. Peak COVID. First circuit breaker. We launched our own islandwide delivery partnering with displaced private-hire drivers to help maintain better margins &amp; to support local drivers who were out of a job. Word spread &amp; it kept us surviving through tough times.<br><br>August 2020. Our 6th franchise store, also our first ever kiosk, opened at Great World City. Two weeks later, our 7th franchise store, whose opening was delayed by COVID-19, opened at Paya Lebar. We had online and in-store queues (with strict social distancing measures in place) to prevent our usual long queues at each store opening, in the midst of a pandemic.<br><br>October 2020. Lucky number eight - our Change Alley Mall (previously Chevron House) franchise store opened its doors after a lengthy delay due to COVID-19. It was odd opening doors to a CBD that was quiet, and not bustling like pre-COVID days.<br><br>November 2020. Government rental relief ended. We had said goodbye to many friends in our Telok Ayer neighbourhood since COVID started in March 2020, but said even more in this month. After four and a half years, we closed the store that started it all - 27 Boon Tat St, in tears, as we moved to a little cloud kitchen nearby in Cross St Exchange, after landlord negotiations fell through. We still hope to be back in our Telok Ayer neighbourhood one day when we find a way to live a ‘new normal’ in a pandemic.</div></div></div><div class='flex sm:space-x-6 sm:flex-row-reverse sm:space-x-reverse'><div class='hidden sm:w-1/2 sm:block'>&nbsp;</div><div><div class='w-4 h-1 rounded' style='position: relative; top: 40px; transform: translateY(-50%); background-color: white;'></div><div class='w-1 rounded' style='position: relative;height: calc(100% + 50px);left: 50%;transform: translateX(-50%);background-color: white;'></div></div><div class='flex-grow ml-6 space-y-2 text-left sm:w-1/2 sm:text-right'><img src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/how-we-began/timeline-icon.png' class='inline-block' style='width: 60px;'><div class='text-2xl font-display'>2021</div><div>February 2021. Our 9th franchise store opens in another cloud kitchen - in Tampines! East siders rejoiced. We explore the viability of cloud kitchens as a way to reach more people around the island with our rainbow bowls, with a fraction of the investment and risk that a larger brick and mortar store would require. We now have ten local stores and one abroad.<br><br>March 2021. We bid goodbye to our Marina One store after 3 years of serving up rainbow bowls. Watching our neighbours vacate the building steadily had been disheartening, but with ups, there are always some downs.<br><br>April 2021. We head further into the west! Our 9th franchise store opens in a cloud kitchen in the heartlands of Clementi. We also launch our first virtual brand, available via delivery only, operating out of all Poke Theory kitchens - Muchos Nachos.<br><br>July 2021. Our 10th franchise store opens, and it isn’t exactly a store in itself. Poke Theory can now be found as a little poke bar in a cosy local grocer - Harvester @ Hillsta!<br><br>August 2021. Call it a cluster. Our franchisees open up in more cloud kitchens - Sembawang and Kovan! Hello to our 11th, 12th and 13th franchise stores!<br><br>December 2021. We opened up in yet another East-side spot - our 14th franchise outlet, this time in Katong!</div></div></div><div class='flex sm:space-x-6'><div class='hidden sm:w-1/2 sm:block'>&nbsp;</div><div><div class='w-4 h-1 rounded' style='position: relative; top: 40px; transform: translateY(-50%); background-color: white;'></div><div class='w-1 rounded' style='position: relative; height: calc(100% + 50px); left: 50%; transform: translateX(-50%); background-color: white;'></div></div><div class='flex-grow ml-6 space-y-2 text-left sm:w-1/2'><img src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/how-we-began/timeline-icon.png' class='inline-block' style='width: 60px;'><div class='text-2xl font-display'>2022</div><div>February &amp; March 2022. We said hello to our 15th franchise store in Tanglin Mall, and our 16th as another cloud kitchen in Serangoon!&#xFEFF;<br><br>April 2022. As we bid our cloud kitchen in Clementi goodbye, we are making plans for a brick and mortar store located in the west for the later part of the year.<br><br>At the same time, we moved our Kent Ridge store into a bigger unit in the same building and took the opportunity to update the space for our customers! &#xFEFF;We were also happy to be onboard a government initiative where kraft bowls and disposables were switched out for ceramic bowls and reusable utensils in efforts to go green.<br></div></div></div></div></div>","style":{"backgroundColor":"#000000","textAlign":"left"}},{"type":"one-column","description":"<style>.bg-pomegranate{width:100%;position:absolute;bottom:0;left:0;pointer-events:none;@media (min-width:640px){.bg-pomegranate{width:600px;left:50%;transform:translateX(-35%);}}}</style><img class='bg-pomegranate' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/how-we-began/bg_pomegranate.jpg'>","style":{"position":"relative","paddingTop":"0","paddingBottom":"0"}}]},{"path":"/sustainability","showOnNavbar":true,"label":"Sustainability","sections":[{"type":"one-column","wide":true,"header":"<div class='mb-8 text-center sm:text-left'>Our Story</div>","description":"<div class='pb-12 text-xl text-center font-display text-primary sm:text-left sm:pb-0'>Sustainability</div>","style":{"textAlign":"left","paddingBottom":"0"}},{"type":"two-columns","columnsOverlapOnMobile":false,"fullWidth":true,"reverse":true,"columns":[{"type":"image","image":{"src":"https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/sustainability/img-1.png","fullWidth":true,"class":"two-column-image","caption":"<style>.two-column-image{max-width:75%;margin:0 auto;}@media (min-width:640px){.two-column-image{max-width:100%;margin:auto;}}</style>","style":{"width":"640px"}}},{"type":"text","align":"left","header":null,"description":"Our business model is fast, food first. That means a heavy reliance on disposable packaging in order to serve you fresh food, quick, especially at a high turnover - and while that is great for us, it isn’t great for the earth.<br><br>There in comes our commitment and embarking on our journey towards being 100% plastic-free. As of April 2019, we went straw-free in all stores. Our poke bowls are made from 100% recycled paper and single-use utensils are made from cornstarch. Our juice bottles are reusable glass bottles which we encourage you to return to us for sterilisation and reuse, or simply reuse them yourself!"}],"style":{"backgroundColor":"#000000"}},{"type":"two-columns","columnsOverlapOnMobile":false,"fullWidth":false,"reverse":false,"columns":[{"type":"image","image":{"src":"https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/sustainability/img-2.png","class":"two-column-image","caption":"<style>.two-column-image{max-width:75%;margin:0 auto;}@media (min-width:640px){.two-column-image{max-width:100%;margin:auto;}}</style>"}},{"type":"text","align":"left","header":null,"description":"Bringing your own container? We’ll give you a free paid topping as a thank you. We also sell stainless steel straws and reusable jute mini lunch totes to add to your sustainable food ware kit.<br><br>Help keep our seas blue by going green with us, one step at a time."}],"style":{"backgroundColor":"#000000"}}]},{"path":"/catering","showOnNavbar":true,"label":"Catering","sections":[{"type":"one-column","wide":true,"header":"<div class='mb-8 text-center sm:text-left'>Food</div>","description":"<div class='text-xl text-center font-display text-primary sm:text-left'>Catering</div>","style":{"textAlign":"left","paddingBottom":"0"}},{"type":"two-columns","columnsOverlapOnMobile":false,"fullWidth":false,"reverse":false,"columns":[{"type":"image","image":{"src":"https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/catering/collage.png","class":"two-column-image","caption":"<style>.two-column-image{max-width:75%;margin:0 auto;}@media (min-width:640px){.two-column-image{max-width:100%;margin:auto;}}</style>"}},{"type":"text","align":"left","header":null,"description":"<div><div class='mb-6 text-2xl sm:w-1/2 font-display sm:text-3xl'>Leave no colleague hungry</div>The good news is that we do bulk orders and catering. The great news is that it starts from a small party of six and up - so we can literally arrange orders for a tiny team lunch but also a 300-strong workshop.<br><br>The best news is that we have specially discounted bundles for our bulk orders that you can refer to in our e-brochure below, and contact us at <a class='font-semibold text-default hover:text-default hover:underline' href='mailto:catering@poketheory.com.sg' target='_blank' rel='noreferrer'>catering@poketheory.com.sg</a> to place your order!<!--<br><br><a href='https://storage.googleapis.com/atlas-core-active-storage/poketheory/BulkOrders_Menu_V12.1.pdf' target='_blank' rel='referrer'><button type='button' class='inline-flex items-center justify-center px-4 py-2 text-sm font-semibold border rounded-sm shadow-sm focus:outline-none border-button-primary text-on-primary bg-primary hover:bg-primary-dark' data-testid='button'>VIEW BULK ORDER BROCHURE</button></a>--></div>"}],"style":{"backgroundColor":"#000000"}}]},{"path":"/career","showOnNavbar":true,"label":"Career","sections":[{"type":"one-column","wide":true,"header":"<div class='text-center sm:text-left'>Career</div>","description":null,"style":{"textAlign":"left","paddingBottom":"0"}},{"type":"two-columns","columnsOverlapOnMobile":false,"fullWidth":false,"reverse":false,"columns":[{"type":"image","image":{"src":"https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/career/career-img.jpg","class":"two-column-image","caption":"<style>.two-column-image{max-width:75%;margin:0 auto;}@media (min-width:640px){.two-column-image{max-width:100%;margin:auto;}}</style>","style":{"position":"relative","zIndex":1}}},{"type":"text","align":"left","header":null,"description":"<div class='relative'><div class='mb-6 text-xl text-center font-display text-primary sm:text-left'>Join the team</div>We’re always hiring, because we’re always growing!<br><br>Whether you’re someone looking for a part-time job building rainbow bowls, a leader ready to manage a store, or a special ninja looking to join our core team growing our Poke Theory brand above and beyond - drop us your details below and we’ll be in touch with you as soon as we can.<br><br></div>","form":{"formType":"career","subjects":["Poke Theory Core Team","Front Of House Service Staff","Back Of House Staff","Others"],"successMessage":"Thank you. We will get back to you within 5 business days."}}],"style":{"backgroundColor":"#000000","paddingBottom":"320px"}},{"type":"one-column","description":"<img style='width:600px;position:absolute;bottom:0;left:0;pointer-events:none' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/career/bg_assembly.jpg'><img style='width:500px;position:absolute;bottom:0;right:0;pointer-events:none' class='hidden lg:block' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/career/bg_people.jpg'>","style":{"position":"relative","paddingTop":"0","paddingBottom":"0"}}]},{"path":"/locations","showOnNavbar":true,"label":"Locations","html":"<div class='relative bg-default2'><img style=' width: 1024px; position: absolute; top: 0; right: 0; pointer-events: none; ' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/locations/bg-location.jpg' /><div class='relative max-w-screen-xl px-3 py-6 mx-auto sm:py-12 sm:px-6'><div class='mb-8 text-2xl text-center sm:text-3xl font-display sm:text-left'>Contact Us </div><div class='mb-6 text-xl text-center font-display text-primary sm:text-left'>Locations </div><div class='grid md:grid-cols-3 sm:grid-cols-2 gap-x-6 gap-y-8'><div class='space-y-6'><div class='flex items-start space-x-2 font-display text-green'><svg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 24 24' stroke='currentColor' class='w-5 h-5'><path stroke-linecap='round' stroke-linejoin='round' stroke-width= ' class='w-5 h-5'><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z'></path><path stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='M15 11a3 3 0 11-6 0 3 3 0 016 0z'></path></svg><div>Tanglin</div></div></div><div class='font-semibold'>163 Tanglin Rd, #02-126 Tanglin Mall, S247933</div><div><div>daily / 11am – 8pm</div></div><div><div>store: 8798 3269 | <a class='text-default hover:text-default hover:underline' href='mailto:tanglin@poketheory.com.sg' target='_blank' rel='noreferrer'>tanglin@poketheory.com.sg</a></div></div><div><a href='https://g.page/r/CRxMKy-gSV1aEB0/review' target='_blank' class='text-default hover:text-default underline'>submit a review</a></div></div></div></div></div>"},{"path":"/franchising","showOnNavbar":true,"label":"Franchising","sections":[{"type":"one-column","description":"<img style='width:1024px;position:absolute;top:0;right:0;pointer-events:none' src='https://poketheory.com.sg/assets/images/atlas-core-active-storage/uploads/poke-theory/franchising/bg-franshise.jpg'>","style":{"position":"relative","paddingTop":"0","paddingBottom":"0"}},{"type":"one-column","wide":true,"header":"<div class='mb-8 relative text-center sm:text-left'>Our Story</div>","description":null,"style":{"backgroundColor":"#000000","textAlign":"left","paddingBottom":"0"}},{"type":"two-columns","columnsOverlapOnMobile":false,"fullWidth":false,"reverse":false,"columns":[{"type":"text","align":"left","header":null,"description":"<div><div class='mb-6 text-xl text-center font-display text-primary sm:text-left'>Franchising</div>What started out as a little dream between siblings, soon grew to Singapore’s favourite poke brand. Poke Theory's success is attributed to its attention to great quality and affordability of its menu despite dishing out high-cost ingredients like sashimi-grade fish. Spearheaded by outstanding branding, effciency in operations and easy scaleability in our product offerings, it's a business model that boasts a lean start-up cost that is attractive to many.<br><br>We take great care in our expansion plans; growing carefully but quickly. We now operate out of fourteen locations islandwide - twelve of which are franchisee-owned, seven of which were opened in the COVID-19 pandemic, demonstrating the ability of our brand and business model to perform even during trying times.<br><br>We opened our first international store in Surabaya, Indonesia in August 2019 and building out our Bali store at a slow pace during COVID times. We are looking to expand further in Jakarta too.<br><br>Keen to be our next franchise operator? Simply drop us an enquiry at <a class='font-semibold text-default hover:text-default hover:underline' href='mailto:hello@poketheory.com.sg' target='_blank' rel='noreferrer'>hello@poketheory.com.sg</a> and we’ll take it from there.</div>"}],"style":{"backgroundColor":"#000000"}}]}],"faqHeaderClass":"max-w-screen-md mx-auto text-left","faq":[{"question":"Are you guys Halal?","answer":"Yes! We are MUIS Halal certified as of 2018 :)"},{"question":"Are you vegan & vegetarian friendly?","answer":"Our Avocado Poke bowls are perfect for vegans & vegetarians. For vegetarians who do not consume alliums (onion & garlic), we recommend requesting from our staff to replace your poke with Lime Avocado instead."},{"question":"Are you gluten-free?","answer":"Unfortunately, all our poke contains soy sauce in our original marinade and are hence not gluten-free."},{"question":"Does your bowls contain allium?","answer":"Unfortunately all our fish and avocado poke contain allium in our original marinade. Choose our Sous Vide Dashi Chicken for an allium-free protein, as well as Lemon Herb Quinoa, Brown Rice, Sesame Soba or Romaine Lettuce for allium-free base options!"},{"question":"Does your bowls contain dairy?","answer":"Please avoid selecting Avocado Miso Salmon/sauce for a dairy-free bowl!"},{"question":"How long can you leave your bowls outside/ Storage instructions?","answer":"We recommend that our poke bowls be eaten right away for best product freshness & quality! If you are not consuming it immediately, poke bowls must be refrigerated until ready to be consumed, within the same day of purchase. We do not recommend keeping poke bowls to consume the next day for food safety purposes, however we do have customers who choose to do this at their own discretion."},{"question":"Stores with Dine-In / no Dine-In?","answer":"The full list of stores where dine-in or take away only is available <a style='color:#FFCB1F;' href='https://poketheory.com.sg/locations'>here</a>."},{"question":"Opening hours?","answer":"Please refer to <a style='color:#FFCB1F;' href='https://poketheory.com.sg/locations'>this link</a> for the operating hours for all stores."},{"question":"Contact for specific stores?","answer":"You'll be able to find the contact details for the respective stores on <a style='color:#FFCB1F;' href='https://poketheory.com.sg/locations'>this page.</a>"},{"question":"What's on your menu?","answer":"You'll be able to browse our full menu <a style='color:#FFCB1F;' href='https://poketheory.com.sg/menu'>here</a>."},{"question":"How can I place bulk/catering orders?","answer":"Kindly drop an email to us to order at <a style='color:#FFCB1F;' href='mailto:catering@poketheory.com.sg'>catering@poketheory.com.sg</a>"},{"question":"Can I check on the order status?","answer":"If you've placed the order from our webpage, kindly reach out to the respective store that you've ordered from. Contact numbers can be found <a style='color:#FFCB1F;' href='https:// poketheory.com.sg/locations'>here</a>. If you've ordered from delivery platforms e.g. Grab, Deliveroo or Food Panda, kindly reach out to the contact support from the respective delivery platform you've ordered from."},{"question":"Can I check on my refund?","answer":"If you ordered from our webpage, kindly email to <a style='color:#FFCB1F;' href='mailto:hello@poketheory.com.sg'>hello@poketheory.com.sg</a> & someone will be in touch with you shortly."}]}
